<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>私人行程 · 需要口令</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<style>
:root {
  --deep: #0e2b26;
  --deep-2: #123a33;
  --paper: #f3ecdd;
  --paper-2: #e9dfcc;
  --ink: #1b2b26;
  --ink-soft: #4d5f57;
  --signal: #e8b84b;
  --coral: #d9614a;
  --line: #1d3b34;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  color: var(--paper);
  background:
    radial-gradient(circle at 18% 12%, rgba(232,184,75,.10), transparent 34%),
    radial-gradient(circle at 82% 88%, rgba(217,97,74,.10), transparent 30%),
    repeating-linear-gradient(0deg, rgba(243,236,221,.035) 0 1px, transparent 1px 28px),
    repeating-linear-gradient(90deg, rgba(243,236,221,.035) 0 1px, transparent 1px 28px),
    linear-gradient(160deg, var(--deep), var(--deep-2));
  font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased;
}
.gate {
  width: 100%;
  max-width: 560px;
  background: var(--paper);
  color: var(--ink);
  border: 1.5px solid var(--line);
  box-shadow: 10px 10px 0 rgba(0,0,0,.28), 0 24px 60px rgba(0,0,0,.32);
  padding: clamp(28px, 6vw, 48px);
  position: relative;
}
.gate::before {
  content: "";
  position: absolute;
  inset: 10px;
  border: 1px solid rgba(29,59,52,.18);
  pointer-events: none;
}
.eyebrow {
  margin: 0 0 18px;
  font: 600 11px/1.4 "SF Mono", ui-monospace, Menlo, monospace;
  letter-spacing: .18em;
  color: var(--coral);
  text-transform: uppercase;
}
h1 {
  margin: 0;
  font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
  font-size: clamp(30px, 6.4vw, 44px);
  line-height: 1.18;
  letter-spacing: -.01em;
  font-weight: 600;
}
h1 em {
  font-style: normal;
  color: var(--deep);
  box-shadow: inset 0 -0.28em 0 rgba(232,184,75,.55);
}
.lede {
  margin: 18px 0 30px;
  max-width: 42ch;
  font-size: 14.5px;
  line-height: 1.75;
  color: var(--ink-soft);
}
form { margin: 0; }
label.field {
  display: block;
  margin-bottom: 8px;
  font: 600 11px/1.4 "SF Mono", ui-monospace, Menlo, monospace;
  letter-spacing: .12em;
  color: var(--ink-soft);
}
input[type="password"] {
  width: 100%;
  padding: 13px 14px;
  border: 1.5px solid var(--line);
  background: var(--paper-2);
  color: var(--ink);
  font: 500 16px/1.4 "SF Mono", ui-monospace, Menlo, monospace;
  letter-spacing: .02em;
  outline: none;
}
input[type="password"]:focus {
  border-color: var(--coral);
  box-shadow: 0 0 0 3px rgba(217,97,74,.18);
}
.remember {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 14px 0 18px;
  font-size: 12.5px;
  color: var(--ink-soft);
  cursor: pointer;
  user-select: none;
}
.remember input { accent-color: var(--coral); width: 15px; height: 15px; }
button {
  width: 100%;
  padding: 14px 18px;
  border: 1.5px solid var(--line);
  background: var(--deep);
  color: var(--paper);
  font: 600 14px/1.2 "PingFang SC", sans-serif;
  letter-spacing: .12em;
  cursor: pointer;
  transition: background .16s ease, transform .16s ease;
}
button:hover { background: var(--coral); }
button:active { transform: translateY(1px); }
button:disabled { opacity: .55; cursor: progress; }
.err {
  min-height: 20px;
  margin: 12px 0 0;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--coral);
}
.err.busy { color: var(--ink-soft); }
.foot {
  margin: 28px 0 0;
  font: 500 10.5px/1.6 "SF Mono", ui-monospace, Menlo, monospace;
  letter-spacing: .1em;
  color: var(--ink-soft);
  text-transform: uppercase;
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<main class="gate">
  <p class="eyebrow">家庭行程 · 2026</p>
  <h1>这段行程，<br><em>只给同行的人</em></h1>
  <p class="lede">输入家庭口令后打开行程。</p>
  <form id="unlock" autocomplete="off" novalidate>
    <label class="field" for="pass">家庭口令</label>
    <input id="pass" type="password" name="pass" inputmode="text"
           autocomplete="current-password" autocapitalize="off"
           spellcheck="false" required>
    <label class="remember"><input id="remember" type="checkbox"> 记住这台设备</label>
    <button id="go" type="submit">打开行程</button>
    <p class="err" id="err" role="alert" aria-live="polite"></p>
  </form>
</main>

aaVPCX/sAXDqOw2YmEL/ymCFOjcJV1a597VEiCXPK9E69fLtVx/8MG/2jhhxaW8joMeDPFlMGl3PuH/h8yxs+vSWgWFsUR385sf4ztvf4igrAu24QRUZM1PAck2hutnXQFPsRCjD9o1rf2IBtreUUbC7EF3WTH2uUK0cZaRK54q+hcQbuyIvj6Yp/bUUrFsSIL/HdP+OYZtiEOus3khYLpCE8NHtotuZ4xRDX2TimjTYCI2qY2oQ6AzPxJ9OZfWDHB5gJA==";
  var SALT = "5hyG+EOj9TiNu2vF++ZYjQ==";
  var IV = "C+kkd0WTEnocET+W";
  var ITER = 600000;
  var STORE = "hainan.unlock.v1";

  var form = document.getElementById("unlock");
  var input = document.getElementById("pass");
  var remember = document.getElementById("remember");
  var button = document.getElementById("go");
  var err = document.getElementById("err");
  var attempts = 0;

  function b64d(s) {
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function b64e(buf) {
    var bytes = new Uint8Array(buf), bin = "";
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }

  async function derive(pass, salt) {
    var raw = new TextEncoder().encode(pass.normalize("NFC"));
    var base = await crypto.subtle.importKey("raw", raw, "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]
    );
  }

  async function open(key, rememberKey) {
    var plain = await crypto.subtle.decrypt(
      { name: "AES-GCM", iv: b64d(IV) }, key, b64d(CT)
    );
    var html = new TextDecoder().decode(plain);
    if (rememberKey) {
      try {
        var exported = await crypto.subtle.exportKey("raw", key);
        localStorage.setItem(STORE, b64e(exported));
      } catch (e) { /* storage full or blocked: still open */ }
    }
    document.open();
    document.write(html);
    document.close();
  }

  async function savedKey() {
    var saved = localStorage.getItem(STORE);
    if (!saved) return null;
    try {
      return await crypto.subtle.importKey(
        "raw", b64d(saved), { name: "AES-GCM" }, false, ["decrypt"]
      );
    } catch (e) {
      localStorage.removeItem(STORE);
      return null;
    }
  }

  function fail(message) {
    err.textContent = message;
    err.classList.remove("busy");
    button.disabled = false;
    input.select();
  }

  async function trySaved() {
    var key = await savedKey();
    if (!key) return false;
    try {
      await open(key, false);
      return true;
    } catch (e) {
      localStorage.removeItem(STORE);
      return false;
    }
  }

  form.addEventListener("submit", async function (event) {
    event.preventDefault();
    var pass = input.value;
    if (!pass) { input.focus(); return; }
    button.disabled = true;
    err.classList.add("busy");
    err.textContent = "正在打开…";
    try {
      var key = await derive(pass, b64d(SALT));
      await open(key, remember.checked);
    } catch (e) {
      attempts += 1;
      var wait = Math.min(1000 * Math.pow(2, attempts - 1), 8000);
      err.textContent = "口令不对，再试一次。";
      err.classList.remove("busy");
      await new Promise(function (r) { setTimeout(r, wait); });
      button.disabled = false;
      input.select();
    }
  });

  if (document.readyState === "complete") trySaved();
  else window.addEventListener("load", trySaved, { once: true });
